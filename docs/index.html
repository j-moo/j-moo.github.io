    </header>
    <main id="content" tabindex="-1">

        <section id="home" class="cover" aria-labelledby="cover-title">

          <h2 id="education-title" class="section-heading slab title"><span class="pen-line" lang="en">education</span></h2>
          <div class="education-rows"></div>

        <section id="projects" class="landing-section" aria-labelledby="project-list-title">

            <h2 id="project-list-title" class="slab title"><span class="pen-line" lang="en">projects</span></h2>
